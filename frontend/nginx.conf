server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /pictures/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Deep Zoom tiles of the stitched wall; wall.json says which build is current.
    location /wall/ {
        expires 7d;
        add_header Cache-Control "public";
        location = /wall/wall.json {
            expires off;
            add_header Cache-Control "no-cache";
        }
    }

    # Names the hashed assets of the current build, so it must never go stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
